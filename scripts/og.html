<!doctype html>
<!--
  Imagem de compartilhamento da página inicial (1200×630). Gerada por scripts/og.js, que tira um
  print desta página com o Chrome ou o Edge e grava em public/og.png. Mesmas cores e fonte da
  loja; as skins são da loja de exemplo. Sem preço: a imagem fica meses no cache do WhatsApp.
  Só skins, sem texto: no computador o WhatsApp mostra a imagem como miniatura quadrada,
  recortada perto do meio, e qualquer recorte de um mosaico continua mostrando skins inteiras.
  Título e descrição aparecem em texto logo abaixo da imagem. As skins mais conhecidas ficam nas
  duas colunas do meio. Para trocar as skins, edite este arquivo e rode npm run og.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Saira Variable';
        font-style: normal;
        font-display: block;
        font-weight: 100 900;
        font-stretch: 50% 125%;
        src: url('../node_modules/@fontsource-variable/saira/files/saira-latin-wdth-normal.woff2') format('woff2-variations');
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 26px 20px;
        align-content: center;
        padding: 0 40px;
        background: #1d232c;
        color: #e8ecf1;
        font-family: 'Saira Variable', sans-serif;
        font-weight: 420;
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        position: relative;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        border-radius: 4px;
        background: #161b22;
        box-shadow: inset 0 -3px 0 var(--rarity);
      }

      .stage::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(46% 12% at 50% 86%, color-mix(in srgb, var(--rarity) 55%, transparent), transparent),
          radial-gradient(85% 70% at 50% 100%, color-mix(in srgb, var(--rarity) 30%, transparent), transparent 75%);
      }

      .stage img {
        position: absolute;
        inset: 8% 7% 14%;
        width: 86%;
        height: 78%;
        object-fit: contain;
        filter: drop-shadow(0 10px 10px rgb(0 0 0 / 0.5));
      }

      .kind {
        margin-top: 10px;
        color: #97a3b6;
        font-size: 17px;
      }

      .star {
        color: var(--rarity-text);
      }

      .stattrak {
        color: #d57d4d;
      }

      .name {
        font-size: 24px;
        font-stretch: 80%;
        font-weight: 640;
        line-height: 1.1;
      }
    </style>
  </head>
